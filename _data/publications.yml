  teaser:   ""
  keywords: "scientific LLM, survey, AI for science, large language models"
  links:
    paper:  "https://arxiv.org/abs/2508.21148"
    code:   "https://github.com/open-sciencelab/Awesome-Scientific-Datasets-and-LLMs"
