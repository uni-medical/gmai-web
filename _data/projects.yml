- title:   "Project Imaging-X: Open Medical Imaging Data Ecosystem"
  area:    "Medical Data Infrastructure"
  status:  "active"
  funding: "Open-source initiative"
  desc:    >
    A comprehensive survey and open-source platform integrating 1,000+ open-access medical
    imaging datasets. We propose a Metadata-Driven Fusion Paradigm (MDFP) to consolidate
    fragmented small datasets into large, coherent data resources, and build an interactive
    discovery portal for end-to-end automated dataset integration. Received collaboration
    interest from top institutions including Stanford University.

- title:   "GMAI-VL / UniMedVL: General Medical Multimodal Vision-Language Model"
  area:    "Medical Multimodal AI"
  status:  "active"
  funding: "Ongoing research"
  desc:    >
    Development of world-leading medical multimodal generation-understanding unified models.
    GMAI-VL is trained on GMAI-VL-5.5M (5.5M image-text pairs across 18 clinical specialties),
    while GMAI-VL-R1 introduces reinforcement learning to achieve ~30% average accuracy
    improvement across eight imaging modalities. UniMedVL targets state-of-the-art performance
    on complex medical tasks including CURE-Bench and MedXpertQA.

- title:   "DTR-MAS: Diagnosis-Treatment-Research Multi-Agent System"
  area:    "Clinical AI Systems"
  status:  "active"
  funding: "Ongoing research"
  desc:    >
    A unified medical scientific discovery platform integrating the full clinical and research
    pipeline: question → evidence retrieval → hypothesis → experiment → validation → knowledge
    distillation. Built on a general-specialist fusion reasoning model, DTR-MAS integrates
    1,000+ medical imaging datasets and 1,000+ tools. Validated on ovarian cancer HRD
    prediction, glaucoma GS3K-Beta gene pathway analysis, and multi-hospital pilot deployments.

- title:   "Medical Image Segmentation Foundation Models"
  area:    "Medical Image Analysis"
  status:  "active"
  funding: "Ongoing research"
  desc:    >
    A family of large-scale medical image segmentation foundation models: STU-Net (scalable
    U-Net from 14M to 1.4B parameters — the largest medical segmentation model), SAM-Med2D
    (adapting SAM to 2D medical images on SA-Med2D-20M benchmark), and SAM-Med3D (voxel-level
    3D context modelling on 21K volumes / 131K 3D masks). Together these models provide
    universally promptable segmentation for clinical and research applications.

- title:   "Autonomous Surgical Robot for Gynecological Surgery"
  area:    "Surgical AI & Robotics"
  status:  "new"
  funding: "Ongoing research"
  desc:    >
    Targeting the world's first fully autonomous robot for gynecological adnexectomy surgery.
    Building on OphCLIP (ophthalmic surgical workflow understanding) and Ophora (text-guided
    surgical video generation), this project integrates reinforcement-learning-based intraoperative
    decision engines and algorithm-hardware co-optimisation for pre-operative planning,
    intraoperative navigation, and post-operative follow-up in a unified pipeline.
