- title:      "Project Imaging-X: Open Medical Imaging Data Ecosystem"
  title_zh:   "Imaging-X 项目：开放医学影像数据生态系统"
  area:       "Medical Data Infrastructure"
  area_zh:    "医学数据基础设施"
  slug:       "imaging-x"
  thumbnail:  "/assets/images/projects/imaging-x/overview.png"
  desc:       >
    A comprehensive survey and open-source platform integrating 1,000+ open-access medical
    imaging datasets. We propose a Metadata-Driven Fusion Paradigm (MDFP) to consolidate
    fragmented small datasets into large, coherent data resources, and build an interactive
    discovery portal for end-to-end automated dataset integration. Received collaboration
    interest from top institutions including Stanford University.
  desc_zh:    >
    整合 1000+ 开放医学影像数据集的综合调研与开源平台。我们提出元数据驱动融合范式（MDFP），
    将碎片化小数据集整合为大规模、连贯的数据资源，并构建交互式发现门户实现端到端自动化数据集整合。
    已获斯坦福大学等顶级机构的合作意向。
  links:
    github:    "https://github.com/uni-medical/Project-Imaging-X"
    paper:     "http://arxiv.org/abs/2603.27460"
    huggingface: "https://huggingface.co/papers/2603.27460"
    dataset:   "https://huggingface.co/datasets/General-Medical-AI/Project-Imaging-X"

- title:      "GMAI-VL: General Medical Multimodal Vision-Language Model"
  title_zh:   "GMAI-VL：通用医学多模态视觉语言模型"
  area:       "Medical Multimodal AI"
  area_zh:    "医学多模态 AI"
  slug:       "gmai-vl"
  thumbnail:  "/assets/images/projects/gmai-vl/gmai_vl1.png"
  desc:       >
    Development of world-leading medical multimodal vision-language models.
    GMAI-VL is trained on GMAI-VL-5.5M (5.5M image-text pairs across 18 clinical specialties),
    while GMAI-VL-R1 introduces reinforcement learning to achieve ~30% average accuracy
    improvement across eight imaging modalities.
  desc_zh:    >
    世界领先的医学多模态视觉语言模型研究。GMAI-VL 在 GMAI-VL-5.5M（涵盖 18 个临床专科的
    550 万图像-文本对）上训练，GMAI-VL-R1 引入强化学习在 8 种影像模态上实现约 30% 的平均准确率提升。
  links:
    github:    "https://github.com/uni-medical/GMAI-VL"
    paper:     "https://arxiv.org/abs/2411.14522"
    huggingface: "https://huggingface.co/papers/2411.14522"

- title:      "SlideChat: Vision-Language Assistant for Whole-Slide Pathology"
  title_zh:   "SlideChat：全切片病理图像视觉语言助手"
  area:       "Clinical AI Systems"
  area_zh:    "临床 AI 系统"
  slug:       "slide-chat"
  thumbnail:  "/assets/images/projects/slide-chat/SlideChat3.png"
  desc:       >
    The first vision-language assistant capable of understanding gigapixel whole-slide pathology
    images in their entirety. Trained on SlideInstruction (4.2K WSI captions, 176K VQA pairs)
    and evaluated on SlideBench, SlideChat achieves state-of-the-art on 18 of 22 tasks,
    including 81.17% accuracy on SlideBench-VQA (TCGA). Accepted at CVPR 2025.
  desc_zh:    >
    首个能够理解千亿像素全切片病理图像的视觉语言助手。在 SlideInstruction（4200 张 WSI 标注、
    17.6 万 VQA 问答对）上训练，在 SlideBench 评测中 22 项任务中 18 项达到最优，
    SlideBench-VQA（TCGA）准确率 81.17%。发表于 CVPR 2025。
  links:
    github:    "https://github.com/uni-medical/SlideChat"
    paper:     "https://arxiv.org/abs/2410.11761"
    huggingface: "https://huggingface.co/General-Medical-AI/SlideChat_Weight"
    dataset:   "https://huggingface.co/datasets/General-Medical-AI/SlideChat"
    homepage:  "https://uni-medical.github.io/SlideChat.github.io/"

- title:      "STU-Net: Scalable and Transferable Medical Image Segmentation Models"
  title_zh:   "STU-Net：可扩展可迁移医学图像分割模型"
  area:       "Medical Image Segmentation"
  area_zh:    "医学图像分割"
  slug:       "stu-net"
  thumbnail:  "/assets/images/projects/stu-net/stu_net7.png"
  desc:       >
    A family of scalable U-Net models (14M to 1.4B parameters) pre-trained on TotalSegmentator
    for universal medical image segmentation. STU-Net-H is the largest medical segmentation
    model to date, achieving 90.06% mean DSC. Won championship at MICCAI 2023 ATLAS and SPPIN
    challenges; runner-up at AutoPET II.
  desc_zh:    >
    参数量从 1400 万到 14 亿的可扩展 U-Net 系列，在 TotalSegmentator 上预训练，用于通用医学图像分割。
    STU-Net-H 是迄今最大的医学分割模型，达到 90.06% 平均 DSC。荣获 MICCAI 2023 ATLAS 和 SPPIN
    挑战赛冠军，AutoPET II 亚军。
  links:
    github:    "https://github.com/uni-medical/STU-Net"
    paper:     "https://arxiv.org/abs/2304.06716"

- title:      "SAM-Med3D: Segment Anything in 3D Medical Images"
  title_zh:   "SAM-Med3D：三维医学图像通用分割"
  area:       "Medical Image Segmentation"
  area_zh:    "医学图像分割"
  slug:       "sam-med3d"
  thumbnail:  "/assets/images/projects/sam-med3d/sam_med3d4.png"
  desc:       >
    Adapting the Segment Anything Model to volumetric medical imaging with a fully native 3D
    architecture. Trained on SA-Med3D-140K (22K volumes, 143K masks across 247 categories),
    SAM-Med3D achieves 60% Dice improvement over SAM with a single 3D point prompt. The
    companion dataset SA-Med2D-20M (4.6M images, 19.7M masks) is the largest 2D medical
    segmentation dataset to date. Published at ECCV 2024 Workshop (Oral) and IEEE TNNLS 2025.
  desc_zh:    >
    将 Segment Anything 模型适配至三维医学影像，采用全原生 3D 架构。在 SA-Med3D-140K
    （22K 体积数据、143K 掩码，涵盖 247 个类别）上训练，SAM-Med3D 仅需单个 3D 点提示即可
    实现相比 SAM 60% 的 Dice 提升。配套数据集 SA-Med2D-20M（460 万张图像、1970 万个掩码）
    是迄今最大的 2D 医学分割数据集。发表于 ECCV 2024 Workshop（Oral）及 IEEE TNNLS 2025。
  links:
    github:    "https://github.com/uni-medical/SAM-Med3D"
    paper:     "https://arxiv.org/abs/2310.15161"
    huggingface: ""
    dataset:   ""
    homepage:  ""

- title:      "MedSegAgent: Universal Multi-Agent System for Medical Image Segmentation"
  title_zh:   "MedSegAgent：通用可扩展多智能体医学图像分割系统"
  area:       "Medical Image Segmentation"
  area_zh:    "医学图像分割"
  slug:       "medsegagent"
  thumbnail:  "/assets/images/projects/medsegagent/medsegagent1.png"
  desc:       >
    A multi-agent system that orchestrates specialized dataset-specific segmentation models
    through natural language instructions. Instead of training a single universal model,
    MedSegAgent parses free-form requests, performs coarse-to-fine dataset matching, and
    integrates results from the best-matched models. Supports 23 datasets and 343 segmentation
    targets across CT, MRI, PET/CT, and ultrasound. Published in IEEE JBHI 2026.
  desc_zh:    >
    一种通过自然语言指令调度专用数据集分割模型的多智能体系统。不同于训练单一通用模型，
    MedSegAgent 解析自由文本请求，执行从粗到精的数据集匹配，并对最佳匹配模型的结果进行集成。
    支持 23 个数据集和 343 个分割目标，覆盖 CT、MRI、PET/CT 和超声等模态。发表于 IEEE JBHI 2026。
  links:
    github:    "https://github.com/uni-medical/MedSegAgent"
    paper:     "https://ieeexplore.ieee.org/document/11455620"

- title:      "OphCLIP: Hierarchical Retrieval-Augmented Ophthalmic Surgical VLP"
  title_zh:   "OphCLIP：眼科手术分层检索增强视觉-语言预训练"
  area:       "Surgical AI & Robotics"
  area_zh:    "手术 AI 与机器人"
  slug:       "ophclip"
  thumbnail:  "/assets/images/projects/ophclip/ophclip1.png"
  desc:       >
    A hierarchical retrieval-augmented vision-language pretraining framework for ophthalmic
    surgical workflow understanding. Trained on OphVL (375K video-text pairs, 7.5K hours,
    15× larger than existing surgical VLP datasets), OphCLIP achieves state-of-the-art
    zero-shot performance on 11 benchmarks for phase recognition and multi-instrument
    identification. Published at ICCV 2025.
  desc_zh:    >
    面向眼科手术工作流理解的分层检索增强视觉-语言预训练框架。在 OphVL（37.5万视频-文本对、
    7500小时视频，规模为现有手术VLP数据集15倍）上训练，OphCLIP在11个基准上取得了阶段识别
    和多器械识别的最优零样本性能。发表于 ICCV 2025。
  links:
    github:    "https://github.com/minghu0830/OphCLIP"
    paper:     "https://arxiv.org/abs/2411.15421"

- title:      "UniMedVL: Unified Medical Multimodal Understanding and Generation"
  title_zh:   "UniMedVL：统一医学多模态理解与生成"
  area:       "Medical Multimodal AI"
  area_zh:    "医学多模态 AI"
  slug:       "unimedvl"
  thumbnail:  "/assets/images/projects/unimedvl/overview.jpg"
  desc:       >
    The first medical unified multimodal model that unifies image understanding and generation within a single architecture. Built on UniMed-5M (5.6M+ samples) with Progressive Curriculum Learning, UniMedVL achieves superior performance on 5 medical understanding benchmarks while matching specialized models in generation quality.
  desc_zh:    >
    首个在单一架构中统一图像理解与生成的医学多模态模型。基于UniMed-5M（560万+样本）和渐进式课程学习策略，UniMedVL在5个医学理解基准上达到领先水平，同时在生成质量上匹配专用模型。
  links:
    github:    ""
    paper:     ""

- title:      "MedITok: Unified Medical Image Tokenizer"
  title_zh:   "MedITok：统一医学图像标记器"
  area:       "Medical Multimodal AI"
  area_zh:    "医学多模态 AI"
  slug:       "meditok"
  thumbnail:  "/assets/images/projects/meditok/overview.jpg"
  desc:       >
    The first unified visual tokenizer for medical images that simultaneously preserves fine-grained anatomical structures and rich clinical semantics. Pre-trained on 33M+ medical images across 9 modalities, MedITok achieves state-of-the-art on 30+ benchmarks spanning reconstruction, classification, generation, and VQA.
  desc_zh:    >
    首个面向医学图像的统一视觉标记器，同时保留细粒度解剖结构和丰富的临床语义。在跨9种模态的3300万+医学图像上预训练，MedITok在涵盖重建、分类、生成和视觉问答的30+基准上达到最优水平。
  links:
    github:    "https://github.com/Masaaki-75/meditok"
    paper:     "https://arxiv.org/abs/2505.19225"
    huggingface: "https://huggingface.co/massaki75/meditok"

- title:      "MedQ-Deg: Evaluating MLLMs Across Medical Image Quality Degradations"
  title_zh:   "MedQ-Deg：医学图像质量退化下的多模态大模型评测基准"
  area:       "Medical AI Evaluation"
  area_zh:    "医学 AI 评估"
  slug:       "medq-deg"
  thumbnail:  "/assets/images/projects/medq-deg/overview.jpg"
  desc:       >
    A comprehensive benchmark for evaluating medical multimodal large language models under
    clinically realistic image quality degradations. MedQ-Deg spans 18 degradation types,
    30 fine-grained capability dimensions, and 7 imaging modalities with 24,894 QA pairs.
    Evaluation of 40 mainstream MLLMs reveals the AI Dunning-Kruger Effect, where models
    maintain inappropriately high confidence despite severe accuracy collapse under degradation.
  desc_zh:    >
    针对临床真实图像质量退化场景的医学多模态大语言模型综合评测基准。MedQ-Deg 涵盖 18 种退化类型、
    30 个细粒度能力维度和 7 种成像模态，共 24,894 个问答对。对 40 个主流多模态大模型的评测揭示了
    AI 邓宁-克鲁格效应——模型在严重精度下降时仍保持不当的高置信度。
  links:
    homepage:  "https://uni-medical.github.io/MedQ-Robust-web"

- title:      "Ophora: Text-Guided Ophthalmic Surgical Video Generation"
  title_zh:   "Ophora：文本引导的眼科手术视频生成模型"
  area:       "Surgical AI"
  area_zh:    "手术 AI"
  slug:       "ophora"
  thumbnail:  "/assets/images/projects/ophora/overview.jpg"
  desc:       >
    A pioneering model for generating realistic ophthalmic surgical videos from natural language
    instructions. Ophora is built on Ophora-160K, a large-scale dataset of over 160K video-instruction
    pairs curated from narrative surgical videos, and employs Progressive Video-Instruction Tuning
    to transfer spatial-temporal knowledge from a pre-trained text-to-video model while preserving
    patient privacy.
  desc_zh:    >
    首个根据自然语言指令生成逼真眼科手术视频的模型。Ophora 基于 Ophora-160K（从叙事手术视频
    中整理的超 16 万视频-指令对大规模数据集），采用渐进式视频-指令微调策略，从预训练的文本到视频
    模型中迁移时空知识，同时保护患者隐私。
  links:
    paper:     "https://arxiv.org/abs/2505.07449"
    github:    "https://github.com/uni-medical/Ophora"

- title:      "Survey of Scientific Large Language Models"
  title_zh:   "科学大语言模型综述：从数据基础到智能体前沿"
  area:       "AI for Science"
  area_zh:    "科学 AI"
  slug:       "survey-scillm"
  thumbnail:  "/assets/images/projects/survey-scillm/overview.jpg"
  desc:       >
    A comprehensive, data-centric survey that reframes the development of Scientific Large Language
    Models (Sci-LLMs) as a co-evolution between models and their data substrate. Covering 270+
    pre-/post-training datasets and 190+ benchmarks, the survey formulates a unified taxonomy of
    scientific data, traces the shift toward process-oriented evaluation, and outlines the paradigm
    of closed-loop autonomous scientific agents.
  desc_zh:    >
    以数据为中心的综合综述，将科学大语言模型（Sci-LLM）的发展重新定义为模型与数据基底的协同演化。
    涵盖 270+ 预训练/后训练数据集和 190+ 基准测试，提出统一的科学数据分类法，追踪面向过程的
    评估范式转变，并描绘闭环自主科学智能体的前景。
  links:
    github:    "https://github.com/open-sciencelab/Awesome-Scientific-Datasets-and-LLMs"

- title:      "MedQ-Bench: Evaluating Medical Image Quality Assessment in MLLMs"
  title_zh:   "MedQ-Bench：多模态大模型医学图像质量评估基准"
  area:       "Medical AI Evaluation"
  area_zh:    "医学 AI 评估"
  slug:       "medq-bench"
  thumbnail:  "/assets/images/projects/medq-bench/overview.jpg"
  desc:       >
    The first comprehensive benchmark for evaluating medical image quality assessment capabilities
    of multimodal large language models. MedQ-Bench establishes a perception-reasoning paradigm
    spanning 5 imaging modalities and 40+ quality attributes, with 2,600 perceptual queries and
    708 reasoning assessments. Evaluation of 14 state-of-the-art MLLMs reveals preliminary but
    unstable perceptual and reasoning skills insufficient for reliable clinical use.
  desc_zh:    >
    首个系统评估多模态大语言模型医学图像质量评估能力的综合基准。MedQ-Bench 建立感知-推理范式，
    涵盖 5 种成像模态和 40+ 质量属性，包含 2,600 个感知查询和 708 个推理评估。对 14 个
    先进多模态大模型的评测显示，模型具有初步但不稳定的感知和推理能力，尚不足以用于可靠的临床实践。
  links:
    paper:     "https://github.com/liujiyaoFDU/MedQ-Bench"
    github:    "https://github.com/liujiyaoFDU/MedQ-Bench"
    dataset:   "https://huggingface.co/datasets/jiyaoliufd/MedQ-Bench"

