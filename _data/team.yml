pi:
  name:     "Junjun He"
  role:     "Principal Investigator"
  title:    "Principal Investigator, GMAI Lab"
  bio:      >
    Junjun He leads the GMAI (General Medical AI) research group. The group focuses on
    building world-leading medical AI models, tools, and multi-agent systems to enable
    precision diagnosis, treatment, and biomedical discovery. Research spans medical
    multimodal large language models, medical image segmentation foundation models,
    clinical AI systems, and medical data infrastructure.
