pi:
  name:     "Junjun He"
  role:     "Principal Investigator"
  title:    "Principal Investigator, GMAI Lab"
  bio:      >
    Junjun He leads the GMAI (General Medical AI) research group. He received his PhD from
    Shanghai Jiao Tong University (SJTU), advised by Prof. Lixu Gu, and conducted research
    at the Multimedia Lab (MMLAB) of Shenzhen Institute of Advanced Technology (SIAT), CAS,
    with Prof. Yu Qiao. His research interests span dense prediction (medical image
    segmentation, object detection, instance segmentation), efficient deep learning
    (model compression, NAS, quantization), and general medical AI — including multimodal
    large language models, segmentation foundation models, clinical AI systems, and
    biomedical data infrastructure.
  photo:    "assets/images/team/junjun_he.jpeg"
  initials: "JH"
  links:
    website: ""
    scholar: "https://scholar.google.com/citations?user=Z4LgebkAAAAJ&hl=zh-CN"
    email:   "hejunjun@sjtu.edu.cn"
    cv:      ""
    github:  ""
    twitter: ""

