  headline:    "Welcoming new visiting researchers to GMAI Lab"
  headline_zh: "欢迎新科研实习生加入 GMAI 实验室"
  body:        >
    We welcome Wenhao Tang (Nankai University), Shujian Gao (Fudan University), and
    Jiashi Lin (Northwestern Polytechnical University) as new visiting researchers,
    bringing expertise in computational pathology, multimodal learning, and LLM-based agents.
  body_zh:     >
    欢迎唐文浩（南开大学）、高书剑（复旦大学）和林佳仕（西北工业大学）作为新科研实习生加入
    GMAI 实验室，带来计算病理学、多模态学习和大语言模型智能体方面的专业知识。
