# ── Site identity ─────────────────────────────────────────────────
title:       "GMAI — General Medical AI"
tagline:     "AI-Empowered Precision Medicine: Diagnosis, Treatment, and Discovery"
description: "We develop world-leading medical AI models, tools, and multi-agent systems
              to enable precision diagnosis, optimal treatment, and accelerated biomedical
              research — making high-quality healthcare universally accessible."
url:         "https://uni-medical.github.io"
baseurl:     "/gmai-web"

# ── Build ─────────────────────────────────────────────────────────
markdown:    kramdown
highlighter: rouge
permalink:   pretty

# ── Plugins (all supported natively by GitHub Pages) ──────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ── Lab metadata (used throughout layouts — edit here only) ───────
lab:
  name:        "GMAI Lab (General Medical AI)"
  shortname:   "GMAI"
  pi:          "Junjun He"
  pi_last:     "He"               # used to bold PI name in author lists
  institution: "Shanghai Artificial Intelligence Laboratory, China"
  department:  ""
  address:     ""
  email:       "hejunjun@pjlab.org.cn"
  github:      "https://github.com/uni-medical"
  scholar:     "https://scholar.google.com/citations?user=Z4LgebkAAAAJ&hl=zh-CN"
  founded:     2020               # TODO: confirm founding year

# ── Hero stats (update when milestones change) ────────────────────
stats:
  publications: "30+"
  members:      "20+"
  citations:    "10,000+"

# ── Sass ──────────────────────────────────────────────────────────
sass:
  sass_dir: _sass
  style:    compressed

# ── Exclude from build output ─────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - docs
  - plans
  - resources
