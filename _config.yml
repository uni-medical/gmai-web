# ── Site identity ─────────────────────────────────────────────────
title:       "GMAI — General Medical AI"
tagline:     "AI at the Frontier of Medicine and Healthcare"
description: "We build world-leading AI models, agents, and tools that advance precision
              medicine and everyday healthcare — expanding access to high-quality diagnosis,
              treatment, and discovery for every clinician, patient, and community."
url:         "https://uni-medical.github.io"
baseurl:     "/gmai-web"

# ── Build ─────────────────────────────────────────────────────────
markdown:    kramdown
highlighter: rouge
permalink:   pretty

# ── Plugins (all supported natively by GitHub Pages) ──────────────
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# ── Lab metadata (used throughout layouts — edit here only) ───────
lab:
  name:        "GMAI Lab (General Medical AI)"
  shortname:   "GMAI"
  pi:          "Junjun He"
  pi_last:     "He"               # used to bold PI name in author lists
  institution: "Shanghai Artificial Intelligence Laboratory, China"
  department:  ""
  address:     ""
  email:       "hejunjun@pjlab.org.cn"
  github:      "https://github.com/uni-medical"
  scholar:     "https://scholar.google.com/citations?user=Z4LgebkAAAAJ&hl=zh-CN"
  huggingface: "https://huggingface.co/General-Medical-AI"
  linkedin:    "https://www.linkedin.com/company/shhailab-gmai/"
  xiaohongshu: "https://xhslink.com/m/50fKRQolEHI"
  zhihu:       "https://www.zhihu.com/people/gmai-38/"
  founded:     2020               # TODO: confirm founding year

# ── Hero stats (update when milestones change) ────────────────────
stats:
  publications: "30+"
  members:      "20+"
  citations:    "10,000+"

# ── Sass ──────────────────────────────────────────────────────────
sass:
  sass_dir: _sass
  style:    compressed

# ── Exclude from build output ─────────────────────────────────────
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .github
  - docs
  - plans
  - resources
